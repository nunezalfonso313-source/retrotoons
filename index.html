<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETRO TOONS — Caricaturas Clásicas en Español</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f5ff;--magenta:#ff00aa;--yellow:#ffe600;--orange:#ff6b00;--green:#00ff88;--bg:#06050e;--card:#0d0b1e;--border:#1c1836;--dim:#6a5f94;--text:#e2d9ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Exo 2',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);background-size:44px 44px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);}
header{position:relative;z-index:10;padding:40px 20px 28px;text-align:center;border-bottom:1px solid rgba(0,245,255,.12);background:linear-gradient(180deg,rgba(0,245,255,.06) 0%,transparent 100%);}
.logo{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,5.5vw,3.5rem);font-weight:900;letter-spacing:.14em;background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(0,245,255,.35));}
.sub{margin-top:5px;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);opacity:.6;}
.app{position:relative;z-index:10;display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 130px);}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 130px);position:sticky;top:0;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(0,245,255,.15);border-radius:2px;}
.search-wrap{padding:14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:2;position:relative;}
.search-wrap input{width:100%;background:rgba(0,245,255,.04);border:1px solid rgba(0,245,255,.2);border-radius:4px;padding:8px 12px 8px 34px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,245,255,.18);}
.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--cyan);opacity:.5;}
.series-count{padding:8px 14px;font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--magenta);opacity:.7;}
.series-item{padding:10px 14px;cursor:pointer;border-left:2px solid transparent;transition:all .18s;display:flex;align-items:center;gap:10px;}
.series-item:hover{background:rgba(0,245,255,.04);border-left-color:rgba(0,245,255,.3);}
.series-item.active{background:rgba(0,245,255,.07);border-left-color:var(--cyan);}
.series-emoji{font-size:1.3rem;flex-shrink:0;}
.series-name{font-size:.78rem;font-weight:600;color:#fff;line-height:1.3;}
.series-year{font-size:.65rem;color:var(--dim);margin-top:1px;}
.badge-yt{display:inline-block;font-size:.5rem;padding:1px 5px;border-radius:2px;background:rgba(255,0,0,.2);border:1px solid rgba(255,80,80,.3);color:#ff8080;margin-left:4px;vertical-align:middle;}
.badge-ar{display:inline-block;font-size:.5rem;padding:1px 5px;border-radius:2px;background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.25);color:var(--cyan);margin-left:4px;vertical-align:middle;}
.main{display:flex;flex-direction:column;}
.player-zone{background:#000;position:relative;}
.player-zone iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}
.player-placeholder{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at center,#0d0b1e 0%,#060510 100%);}
.player-placeholder .big-emoji{font-size:4rem;}
.player-placeholder p{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;}
.series-header{padding:14px 20px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.series-header .emoji{font-size:2rem;}
.series-title{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.series-meta{font-size:.72rem;color:var(--dim);margin-top:3px;}
.series-desc{font-size:.75rem;line-height:1.6;color:var(--text);opacity:.75;margin-top:6px;max-width:680px;}
.episodes-section{flex:1;overflow-y:auto;padding:14px 20px;max-height:260px;}
.episodes-section::-webkit-scrollbar{width:4px;}
.episodes-section::-webkit-scrollbar-thumb{background:rgba(0,245,255,.12);border-radius:2px;}
.ep-label{font-family:'Orbitron',sans-serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);opacity:.8;margin-bottom:10px;}
.yt-note{font-size:.7rem;color:var(--dim);margin-bottom:10px;padding:8px 10px;border:1px solid rgba(255,80,80,.2);border-radius:4px;background:rgba(255,0,0,.05);}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.ep-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px 12px;cursor:pointer;transition:all .18s;position:relative;}
.ep-card:hover{border-color:rgba(0,245,255,.35);background:rgba(0,245,255,.04);}
.ep-card.playing{border-color:var(--cyan);background:rgba(0,245,255,.07);box-shadow:0 0 14px rgba(0,245,255,.12);}
.ep-card.playing::before{content:'▶';position:absolute;top:6px;right:8px;font-size:.6rem;color:var(--cyan);}
.ep-num{font-family:'Orbitron',sans-serif;font-size:.58rem;color:var(--dim);letter-spacing:.1em;margin-bottom:4px;}
.ep-name{font-size:.73rem;font-weight:600;color:var(--text);line-height:1.35;}
.ep-audio{margin-top:5px;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--green);opacity:.7;}
.loading{display:none;position:absolute;inset:0;background:rgba(6,5,14,.85);align-items:center;justify-content:center;z-index:5;}
.loading.show{display:flex;}
.spinner{width:36px;height:36px;border:2px solid rgba(0,245,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{padding:20px;text-align:center;color:var(--dim);font-size:.75rem;letter-spacing:.1em;}
footer{position:relative;z-index:10;padding:14px 20px;border-top:1px solid var(--border);font-size:.65rem;color:var(--dim);letter-spacing:.1em;text-align:center;}
@media(max-width:680px){.app{grid-template-columns:1fr;}.sidebar{max-height:220px;position:static;border-right:none;border-bottom:1px solid var(--border);}}
</style>
</head>
<body>
<header>
  <div class="logo">📺 RETRO TOONS</div>
  <p class="sub">Caricaturas Clásicas · Audio Español Latino · 80s &amp; 90s</p>
</header>
<div class="app">
  <aside class="sidebar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Buscar serie...">
    </div>
    <div class="series-count" id="series-count"></div>
    <div id="series-list"></div>
  </aside>
  <main class="main">
    <div class="player-zone" id="player-zone">
      <div class="player-placeholder" id="placeholder">
        <span class="big-emoji">📺</span>
        <p>Selecciona una serie para comenzar</p>
      </div>
      <div class="loading" id="loading"><div class="spinner"></div></div>
    </div>
    <div id="series-header"></div>
    <div class="episodes-section" id="episodes-section">
      <div class="empty">← Elige una serie del menú</div>
    </div>
  </main>
</div>
<footer>RETRO TOONS · Archive.org + YouTube · Solo para uso personal nostálgico 🕹️</footer>

<script src="catalogo.js"></script>
<script>
let currentSeries=null, currentEp=null, searchTerm='';

function badgeHtml(type){
  if(type==='archive'||type==='archive') return '<span class="badge-ar">Archive</span>';
  return '<span class="badge-yt">YouTube</span>';
}

function renderSidebar(){
  const list=document.getElementById('series-list');
  const count=document.getElementById('series-count');
  const filtered=CATALOG.filter(s=>!searchTerm||s.title.toLowerCase().includes(searchTerm));
  count.textContent=`▸ ${filtered.length} series`;
  if(!filtered.length){list.innerHTML='<div class="empty">Sin resultados</div>';return;}
  list.innerHTML=filtered.map(s=>`
    <div class="series-item ${currentSeries?.id===s.id?'active':''}" onclick="selectSeries('${s.id}')">
      <span class="series-emoji">${s.emoji}</span>
      <div>
        <div class="series-name">${s.title}${badgeHtml(s.type)}</div>
        <div class="series-year">${s.years} · ${s.episodes.length} eps</div>
      </div>
    </div>`).join('');
}

function selectSeries(id){
  currentSeries=CATALOG.find(s=>s.id===id);
  currentEp=null;
  renderSidebar();
  renderHeader();
  renderEpisodes();
  showPlaceholder();
}

function renderHeader(){
  const el=document.getElementById('series-header');
  if(!currentSeries){el.innerHTML='';return;}
  const s=currentSeries;
  el.innerHTML=`
    <div class="series-header">
      <span class="emoji">${s.emoji}</span>
      <div>
        <div class="series-title">${s.title}</div>
        <div class="series-meta">${s.years} · 🔊 ${s.audio} · ${s.episodes.length} episodios</div>
        <div class="series-desc">${s.desc}</div>
      </div>
    </div>`;
}

function renderEpisodes(){
  const sec=document.getElementById('episodes-section');
  if(!currentSeries){sec.innerHTML='<div class="empty">← Elige una serie del menú</div>';return;}
  const isYT=currentSeries.type==='ytplaylist'||currentSeries.type==='youtube';
  const ytNote=isYT?`<div class="yt-note">▶ Fuente YouTube — el player cargará la playlist completa. Navega los episodios dentro del player.</div>`:'';
  sec.innerHTML=`
    <div class="ep-label">▸ Episodios · ${currentSeries.episodes.length} total</div>
    ${ytNote}
    <div class="episodes-grid">
      ${currentSeries.episodes.map(ep=>`
        <div class="ep-card ${currentEp?.n===ep.n?'playing':''}" onclick="playEpisode('${ep.n}')">
          <div class="ep-num">EP ${ep.n}</div>
          <div class="ep-name">${ep.title}</div>
          <div class="ep-audio">🔊 Latino</div>
        </div>`).join('')}
    </div>`;
}

function buildEmbedUrl(s, ep){
  if(s.type==='archive'){
    return `https://archive.org/embed/${s.identifier}?playlist=1&list_id=${s.identifier}`;
  }
  if(s.type==='ytplaylist'){
    // Embed playlist de YouTube, el índice corresponde al número de episodio
    const idx=parseInt(ep.n,10)-1;
    return `https://www.youtube.com/embed/videoseries?list=${s.playlistId}&index=${idx}&autoplay=1`;
  }
  if(s.type==='youtube'){
    return `https://www.youtube.com/embed/${s.videoId}?autoplay=1`;
  }
  return '';
}

function playEpisode(epN){
  const ep=currentSeries.episodes.find(e=>e.n===epN);
  if(!ep) return;
  currentEp=ep;
  const zone=document.getElementById('player-zone');
  const loading=document.getElementById('loading');
  const ph=document.getElementById('placeholder');
  if(ph) ph.remove();
  const old=zone.querySelector('iframe');
  if(old) old.remove();
  loading.classList.add('show');
  const src=buildEmbedUrl(currentSeries, ep);
  const iframe=document.createElement('iframe');
  iframe.src=src;
  iframe.allowFullscreen=true;
  iframe.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';
  if(currentSeries.type==='archive'){
    iframe.setAttribute('sandbox','allow-same-origin allow-scripts allow-forms allow-popups allow-presentation allow-autoplay');
  }
  iframe.onload=()=>loading.classList.remove('show');
  zone.insertBefore(iframe,loading);
  renderEpisodes();
  zone.scrollIntoView({behavior:'smooth',block:'start'});
}

function showPlaceholder(){
  const zone=document.getElementById('player-zone');
  const old=zone.querySelector('iframe');
  const oldph=zone.querySelector('.player-placeholder');
  if(old) old.remove();
  if(oldph) oldph.remove();
  zone.insertAdjacentHTML('afterbegin',`
    <div class="player-placeholder" id="placeholder">
      <span class="big-emoji">${currentSeries?currentSeries.emoji:'📺'}</span>
      <p>${currentSeries?'Selecciona un episodio':'Selecciona una serie'}</p>
    </div>`);
}

document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.toLowerCase().trim();
  renderSidebar();
});

renderSidebar();
</script>
</body>
</html>
